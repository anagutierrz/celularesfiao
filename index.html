<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Afiliación de Tiendas | Celulares Fiao Partners</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --deep-blue: #031e40;
            --vibrant-green: #1c723e;
            --light-text: #e0e0e0;
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0;
            background-color: var(--deep-blue);
            color: var(--light-text);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden; /* Para que la aurora no genere scroll */
            position: relative;
        }

        /* Fondo de Aurora Boreal con animación */
        .aurora-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 10% 20%, #031e40 0%, transparent 50%),
                radial-gradient(circle at 90% 80%, #1c723e 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, #031e40 0%, transparent 40%);
            background-size: 150% 150%;
            animation: aurora-move 20s infinite alternate ease-in-out;
            opacity: 0.7;
            z-index: -1;
        }

        @keyframes aurora-move {
            0% { background-position: 0% 0%; }
            100% { background-position: 100% 100%; }
        }

        /* Contenedor principal del formulario */
        .form-wrapper {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 25px;
            padding: 50px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
            display: flex;
            gap: 40px;
            max-width: 900px;
            width: 90%;
            z-index: 1;
            position: relative;
        }

        .form-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .form-header h2 {
            font-size: 2.5rem;
            margin-bottom: 15px;
            color: var(--white);
            line-height: 1.2;
        }

        .form-header p {
            color: var(--light-text);
            opacity: 0.8;
            font-size: 1.1rem;
        }

        /* Sección de Beneficios */
        .benefits-sidebar {
            flex: 1;
            padding-right: 20px;
            border-right: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 25px;
        }

        .benefit-item {
            display: flex;
            align-items: center;
            gap: 15px;
            color: var(--light-text);
            font-weight: 600;
            font-size: 1.1rem;
            text-shadow: 0 0 5px rgba(0,0,0,0.2);
        }

        .benefit-item i {
            background: var(--vibrant-green);
            color: white;
            padding: 12px;
            border-radius: 12px;
            font-size: 1.3rem;
            box-shadow: 0 5px 15px rgba(28, 114, 62, 0.4);
        }

        /* Formulario */
        .registration-form {
            flex: 2;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        .input-group {
            position: relative;
        }

        .input-group label {
            position: absolute;
            top: 15px;
            left: 15px;
            color: var(--light-text);
            pointer-events: none;
            transition: 0.3s ease;
            font-size: 0.95rem;
            opacity: 0.7;
        }

        .input-group input,
        .input-group select {
            width: 100%;
            padding: 25px 15px 10px 15px; /* Más padding arriba para el label flotante */
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            color: var(--white);
            font-size: 1rem;
            box-sizing: border-box;
            transition: 0.3s;
        }

        .input-group input:focus,
        .input-group select:focus {
            border-color: var(--vibrant-green);
            outline: none;
            background: rgba(0, 0, 0, 0.3);
        }

        .input-group input:focus + label,
        .input-group input:not(:placeholder-shown) + label,
        .input-group select:focus + label,
        .input-group select:valid + label {
            top: 8px;
            left: 15px;
            font-size: 0.75rem;
            color: var(--vibrant-green);
            opacity: 1;
        }
        
        /* Botón "Afiliarse Ahora" */
        .btn-affiliate {
            grid-column: 1 / -1; /* Ocupa ambas columnas */
            background: linear-gradient(90deg, var(--vibrant-green) 0%, #308f51 100%);
            color: white;
            padding: 18px 30px;
            border: none;
            border-radius: 12px;
            font-weight: 800;
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.4s ease;
            box-shadow: 0 10px 25px rgba(28, 114, 62, 0.5);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-affiliate:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(28, 114, 62, 0.6);
            background: linear-gradient(90deg, #308f51 0%, var(--vibrant-green) 100%);
        }

        @media (max-width: 768px) {
            .form-wrapper { flex-direction: column; padding: 30px; }
            .benefits-sidebar { border-right: none; padding-right: 0; margin-bottom: 30px; border-bottom: 1px solid var(--glass-border); padding-bottom: 30px; }
            .registration-form { grid-template-columns: 1fr; }
            .form-header h2 { font-size: 2rem; }
        }
    </style>
</head>
<body>
    <div class="aurora-background"></div>

    <div class="form-header">
        <h2>Únete a Nuestra Red de Tiendas</h2>
        <p>Potencia tus ventas ofreciendo financiamiento de celulares a tus clientes.</p>
    </div>

    <div class="form-wrapper">
        <div class="benefits-sidebar">
            <div class="benefit-item">
                <i class="fas fa-hand-holding-usd"></i>
                <span>Cobro Inmediato</span>
            </div>
            <div class="benefit-item">
                <i class="fas fa-chart-line"></i>
                <span>Aumenta tus Ventas</span>
            </div>
            <div class="benefit-item">
                <i class="fas fa-money-check-alt"></i>
                <span>Cero Riesgo de Cobro</span>
            </div>
            <div class="benefit-item">
                <i class="fas fa-tachometer-alt"></i>
                <span>Aprobación Rápida</span>
            </div>
        </div>

        <form class="registration-form">
            <div class="input-group">
                <input type="text" id="storeName" placeholder=" " required>
                <label for="storeName">Nombre de la Tienda</label>
            </div>
            <div class="input-group">
                <input type="text" id="rnc" placeholder=" " required>
                <label for="rnc">RNC o Cédula</label>
            </div>
            <div class="input-group">
                <input type="tel" id="whatsapp" placeholder=" " required>
                <label for="whatsapp">WhatsApp</label>
            </div>
            <div class="input-group">
                <input type="email" id="email" placeholder=" " required>
                <label for="email">Correo Electrónico</label>
            </div>
            <div class="input-group">
                <input type="text" id="province" placeholder=" " required>
                <label for="province">Provincia</label>
            </div>
            <div class="input-group">
                <input type="password" id="password" placeholder=" " required>
                <label for="password">Contraseña</label>
            </div>
            
            <button type="submit" class="btn-affiliate">¡AFILIARSE AHORA!</button>
        </form>
    </div>

</body>
</html>
